name: CI

# One job, one gate. Everything this repo checks lives in `npm run check`, so
# CI and a local run cannot disagree about what green means.
#
# THE DEPLOY IS A STEP OF THIS JOB, after the gate: there is no build, so
# `site/` is published byte for byte as the gate read it.
#
# IT IS INERT WITHOUT THE TOKEN. `HAVE_CF_TOKEN` is a boolean derived from the
# secret, never the secret; only the deploy step receives the token.
#
# THE PAGES PROJECT (`feeling`) HAS NO GIT SOURCE, created by direct upload on
# 2026-11-20. A project connected to the repository builds every push itself
# and waits for no workflow (sproutvest). If it is ever recreated, re-check.
#
# WHAT THIS CANNOT SEE: zone settings (Email Routing for hello@, the www
# hostname) and every response header except the CSP, which the last step reads.
#
# EMAIL ADDRESS OBFUSCATION IS OFF FOR THE ZONE (dashboard, 2026-11-20). On, it
# rewrote the page's mailto into a /cdn-cgi script link, breaking the no-JS link,
# the copy button and the byte comparison below. Turned back on, that comparison
# is what goes red.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run that may be mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HAVE_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run check

      - name: Deploy to Cloudflare Pages
        if: env.HAVE_CF_TOKEN == 'true' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        # SHA-pinned because this step holds CLOUDFLARE_API_TOKEN (tj-actions,
        # March 2025). Same SHA as lavigo, lastwire and nanomedic.
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6010d070417dea8ddd87556f1ecf622c
          # Exact, for lavigo's reason (its D11): 4.152.0 is the version seen
          # publishing to classic Pages; a newer one may delegate `pages` to
          # Workers and, in CI, auto-confirm creating a Worker instead. Here
          # rather than in package.json because nothing else uses wrangler.
          wranglerVersion: "4.152.0"
          command: pages deploy site --project-name=feeling --branch=master

      # A green deploy is not a served page: wait until production serves this
      # commit's exact index.html, then confirm the CSP header arrives with it.
      - name: Production is this commit, and sends its CSP
        if: env.HAVE_CF_TOKEN == 'true' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: |
          want=$(sha256sum site/index.html | cut -d' ' -f1)
          for i in $(seq 1 30); do
            live=$(curl -sf --max-time 10 https://feelingthemachine.com/ | sha256sum | cut -d' ' -f1 || true)
            [ "$live" = "$want" ] && break
            sleep 3
          done
          if [ "$live" != "$want" ]; then
            echo "::error::feelingthemachine.com is not serving this commit's index.html after 90 s"
            exit 1
          fi
          curl -sI https://feelingthemachine.com/ | grep -i "^content-security-policy: .*form-action" \
            || { echo "::error::production sends no CSP"; exit 1; }

      # UNTIL GO-LIVE (#28) PRODUCTION MUST REFUSE SIGN-UPS. ACCOUNTS_OPEN in
      # wrangler.toml is "false"; a 503 here proves the deployed Functions read
      # it. #28 replaces this step with one that requires the API to answer.
      - name: Accounts stay closed until go-live
        if: env.HAVE_CF_TOKEN == 'true' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'origin: https://feelingthemachine.com' \
            -H 'content-type: application/json' -d '{}' https://feelingthemachine.com/api/start)
          if [ "$code" != "503" ]; then
            echo "::error::/api/start answered $code, not 503: accounts are open before go-live (#28)"
            exit 1
          fi
          echo "accounts closed (503), as they must be until #28"
